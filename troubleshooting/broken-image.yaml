# Lab: ImagePullBackOff. The tag below does not exist in GHCR.
# kubectl apply -f troubleshooting/broken-image.yaml
# kubectl get pods -n inventory ; kubectl describe pod -n inventory -l app=broken-image
apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-broken-image
  namespace: inventory
spec:
  replicas: 1
  selector:
    matchLabels: {app: broken-image}
  template:
    metadata:
      labels: {app: broken-image}
    spec:
      containers:
        - name: backend
          image: ghcr.io/mohitsagar11/inventory-backend:does-not-exist
