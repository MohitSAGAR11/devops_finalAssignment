# EKS only. Since EKS 1.30 there is no default StorageClass, so the Postgres PVC would stay
# Pending. This makes an encrypted gp3 class (provisioned by the EBS CSI add-on) the default.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.aws.com
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete
allowVolumeExpansion: true
parameters:
  type: gp3
  encrypted: "true"
