name: Inventory Manager CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Every third-party action is pinned to a full commit SHA (tag in the comment).
# Tags are mutable: in March 2026 most trivy-action tags were force-pushed to
# malicious code (CVE-2026-33634). A SHA cannot be rewritten.

permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  # ---------------------------------------------------------------- TEST
  test:
    name: Test backend & build frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run pytest (fails the pipeline on any test failure)
        working-directory: backend
        run: pytest -v

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

  lint-infra:
    name: Lint Helm chart & Terraform
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: helm lint
        run: |
          helm lint helm/inventory -f helm/inventory/values-prod.yaml
          helm lint helm/inventory -f helm/inventory/values-dev.yaml
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      - name: terraform fmt + validate
        working-directory: terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false -input=false
          terraform validate

  # ------------------------------------------- BUILD + SECURITY SCAN + PUSH
  build-scan-push:
    name: Build, scan & push images
    needs: [test, lint-infra]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      backend_image: ${{ steps.names.outputs.backend }}
      frontend_image: ${{ steps.names.outputs.frontend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # GHCR repository names must be lowercase; the GitHub owner may not be.
      - name: Compute image names
        id: names
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "backend=${REGISTRY}/${owner}/inventory-backend" >> "$GITHUB_OUTPUT"
          echo "frontend=${REGISTRY}/${owner}/inventory-frontend" >> "$GITHUB_OUTPUT"

      - name: Build images (tagged with the commit SHA)
        run: |
          docker build -t ${{ steps.names.outputs.backend }}:${{ github.sha }} ./backend
          docker build -t ${{ steps.names.outputs.frontend }}:${{ github.sha }} ./frontend

      - name: Trivy scan — backend
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.names.outputs.backend }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Trivy scan — frontend
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.names.outputs.frontend }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      # Only images that passed the scan are pushed, and only from main.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push images
        if: github.event_name != 'pull_request'
        run: |
          docker push ${{ steps.names.outputs.backend }}:${{ github.sha }}
          docker push ${{ steps.names.outputs.frontend }}:${{ github.sha }}

  # ---------------------------------------------------------------- DEPLOY
  # Runs only when the EKS_CLUSTER_NAME repository variable is set, so the pipeline
  # stays green after `terraform destroy` (just unset the variable).
  deploy:
    name: Deploy to EKS with Helm
    needs: build-scan-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.EKS_CLUSTER_NAME != ''
    runs-on: ubuntu-latest
    # No `environment:` here on purpose: it would change the OIDC token subject and
    # break the IAM trust policy in terraform/github-oidc.tf (repo:<owner>/<repo>:ref:refs/heads/main).
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write # GitHub OIDC token -> short-lived AWS credentials, no stored keys
    env:
      AWS_REGION: ${{ vars.AWS_REGION || 'ap-south-1' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Configure kubectl
        run: aws eks update-kubeconfig --region "$AWS_REGION" --name "${{ vars.EKS_CLUSTER_NAME }}"

      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: helm upgrade --install
        env:
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          if [ -z "$POSTGRES_PASSWORD" ]; then
            echo "::error::Set the POSTGRES_PASSWORD repository secret before deploying."; exit 1
          fi
          helm upgrade --install inventory ./helm/inventory \
            --namespace inventory --create-namespace \
            -f helm/inventory/values-prod.yaml \
            --set backend.image.repository=${{ needs.build-scan-push.outputs.backend_image }} \
            --set backend.image.tag=${{ github.sha }} \
            --set frontend.image.repository=${{ needs.build-scan-push.outputs.frontend_image }} \
            --set frontend.image.tag=${{ github.sha }} \
            --set-string postgres.password="$POSTGRES_PASSWORD" \
            --wait --timeout 10m

      - name: Show rollout
        run: |
          kubectl get pods,svc,ingress,hpa -n inventory
          kubectl get deploy -n inventory \
            -o custom-columns='NAME:.metadata.name,IMAGE:.spec.template.spec.containers[0].image,READY:.status.readyReplicas'
